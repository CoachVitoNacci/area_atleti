<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f6e68">
<title>La mia area atleta · prototipo</title>
<style>
:root{--bg:#edf3f2;--card:#fff;--tx:#18282a;--mu:#68797b;--ln:#dfe7e6;--ac:#0f6e68;--ac2:#e6f2f1;--g:#2e9e63;--y:#e2a400;--r:#d64545;--sh:0 1px 2px rgba(20,40,40,.06),0 8px 22px rgba(20,40,40,.07);color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0e1514;--card:#18221f;--tx:#e8f0ee;--mu:#9bb0ae;--ln:#2a3836;--ac:#4fc1b8;--ac2:#1d3330;--g:#5fcf8f;--y:#f0c24a;--r:#ff7b6b;--sh:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif}
.phone{max-width:460px;margin:0 auto;min-height:100vh;padding-bottom:88px}
.top{display:flex;justify-content:space-between;align-items:center;padding:calc(16px + env(safe-area-inset-top)) 20px 6px}
.hi{font-size:22px;font-weight:700}.dt{font-size:13px;color:var(--mu);text-transform:capitalize}
.icb{width:40px;height:40px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--sh);font-size:18px;cursor:pointer;color:var(--tx)}
.card{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:16px;margin:12px 16px}
.ct{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.mu{color:var(--mu)}.sm{font-size:13px}.xs{font-size:12px}
.banner{margin:10px 16px;padding:10px 14px;border-radius:12px;background:#fff4d6;color:#6b4e00;font-size:13px}
.banner.bad{background:#fde3e0;color:#8a2a22}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(460px,100%);display:flex;background:var(--card);border-top:1px solid var(--ln);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
.tabs button{flex:1;background:none;border:0;color:var(--mu);font:inherit;font-size:10px;padding:6px 1px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button span{font-size:20px;line-height:1}.tabs button.on{color:var(--ac);font-weight:700}
.mood{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.mood button{border:2px solid var(--ln);background:var(--bg);border-radius:12px;padding:8px 0 4px;cursor:pointer;color:var(--tx);font:inherit;display:flex;flex-direction:column;align-items:center;gap:2px}
.mood button span{font-size:24px;line-height:1.1}.mood button b{font-size:12px}
.mood button.on{border-color:var(--ac);background:var(--ac2)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--bg);border-radius:14px;padding:12px}.tile.full{grid-column:1/-1}
.tl{font-size:12px;color:var(--mu);display:flex;align-items:center;justify-content:space-between}
.tv{font-size:26px;font-weight:700;line-height:1.15;margin-top:2px}.tv small{font-size:13px;font-weight:500;color:var(--mu)}
.td{font-size:12px;color:var(--mu);margin-top:2px}
.dot{width:13px;height:13px;border-radius:50%;display:inline-block;background:var(--ln)}.dot.g{background:var(--g)}.dot.y{background:var(--y)}.dot.r{background:var(--r)}
.leg{font-size:12px;color:var(--mu);margin-top:10px}.leg .dot{width:10px;height:10px;vertical-align:-1px;margin:0 3px 0 8px}
.wx{display:flex;align-items:center;gap:14px}.wx .big{font-size:42px;line-height:1}
.pill{display:inline-block;background:var(--ac2);color:var(--ac);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600}
.ev{padding:10px 0;border-bottom:1px solid var(--ln)}.ev:last-child{border-bottom:0;padding-bottom:0}.ev:first-child{padding-top:0}
.ev .h{display:flex;gap:10px;align-items:flex-start}.ev .ic{font-size:24px;line-height:1.2}
.ev summary{cursor:pointer;color:var(--ac);font-size:13px;margin-top:4px}
.ev pre{white-space:pre-wrap;font:inherit;font-size:13px;margin:6px 0 0;color:var(--mu)}
.day{font-size:13px;font-weight:700;color:var(--ac);margin:14px 18px 0;text-transform:capitalize}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:99px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--ln)}th:first-child,td:first-child{text-align:left}th{color:var(--mu);font-weight:600;font-size:12px}
tr.cur td{background:var(--ac2);font-weight:700}tr.avg td{font-style:italic;color:var(--mu)}
.bars{display:flex;align-items:flex-end;gap:8px;height:90px;margin:4px 0 2px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--mu)}.bars i{display:block;background:#bfd3d1;border-radius:5px 5px 0 0;margin:2px 14% 2px}.bars .c i{background:var(--ac)}
.msg{background:var(--ac2);border-radius:14px;padding:12px 14px;font-size:14px}.msg b{font-weight:700}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer}.btn.sec{background:var(--bg);color:var(--tx);border:1px solid var(--ln)}
.rpbox{overflow:hidden;border-radius:10px;box-shadow:var(--sh);margin-bottom:12px;background:#fff}.rpin{transform-origin:0 0;width:794px}
.chat{display:flex;flex-direction:column;gap:8px;max-height:48vh;overflow:auto;padding:4px 2px 10px}
.b{max-width:82%;padding:8px 12px;border-radius:16px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}.b.me{align-self:flex-end;background:var(--ac);color:#fff;border-bottom-right-radius:4px}.b.co{align-self:flex-start;background:var(--bg);border-bottom-left-radius:4px}
.inp{display:flex;gap:8px}.inp input{flex:1;padding:11px 14px;border:1px solid var(--ln);border-radius:99px;background:var(--bg);color:var(--tx);font:inherit}
.sheet{position:fixed;inset:0;background:rgba(10,20,20,.55);z-index:20;display:none;overflow:auto}.sheet.on{display:block}
.sheet .in{max-width:460px;margin:0 auto;background:var(--card);min-height:100%;padding:20px}
.sheet label{display:block;font-size:13px;color:var(--mu);margin:12px 0 3px}.sheet input,.sheet select{width:100%;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.sheet .row{display:flex;gap:8px;align-items:center}.sheet .row input[type=checkbox]{width:auto}
.center{text-align:center;padding:40px 24px}.center .big{font-size:48px}
.tap{cursor:pointer}.tap:active{background:var(--ac2)}
.zr{display:flex;align-items:center;gap:8px;font-size:12px;margin:4px 0}.zr .zl{width:34px;color:var(--mu)}.zr .zb{flex:1;background:var(--bg);border-radius:6px;height:12px;overflow:hidden}.zr .zb i{display:block;height:100%;border-radius:6px}.zr .zt{width:78px;text-align:right}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--ln);font-size:14px}.kv:last-child{border-bottom:0}.kv span:first-child{color:var(--mu)}.kv b{text-align:right}
.mbar{display:flex;height:12px;border-radius:7px;overflow:hidden;margin:8px 0 4px}.mbar i{display:block;height:100%}
.ml{font-size:12px;color:var(--mu)}.ml b{color:var(--tx)}.sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 4px 0 8px;vertical-align:0}.sw:first-child{margin-left:0}
.meal{padding:10px 0;border-bottom:1px solid var(--ln)}.meal:last-child{border-bottom:0}.meal ul{margin:4px 0 0;padding-left:18px;color:var(--mu);font-size:13px}
.art{padding:12px 0;border-bottom:1px solid var(--ln)}.art:last-child{border-bottom:0}.tag{font-size:11px;font-weight:700;color:var(--ac);background:var(--ac2);border-radius:99px;padding:1px 8px;margin-right:6px}
.qa{background:var(--bg);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}.qa .w{font-size:12px;color:var(--mu)}
.back{background:none;border:0;color:var(--ac);font:inherit;font-weight:600;padding:0;margin:0 20px;cursor:pointer}
details.dd summary{cursor:pointer;color:var(--ac);font-weight:600;margin-top:10px}
a.lnk{color:var(--ac);font-weight:600}
</style></head><body>
<div class="phone">
 <div class="top"><div><div class="hi" id="hi">Ciao</div><div class="dt" id="dt"></div></div><button class="icb" id="gear" aria-label="Impostazioni">⚙️</button></div>
 <div id="banner"></div>
 <main id="view"></main>
</div>
<nav class="tabs" id="tabs"></nav>
<div class="sheet" id="sheet"><div class="in" id="sin"></div></div>
<script>
const P={short:7,long:60,tol:3,weeks:4,loadTol:20,sleepH:0.5,sleepQ:10}; // sleepH: calo ore sonno (h); sleepQ: calo qualità (%)
const KG=['kg_lifted','icu_kg_lifted','icu_weight_lifted'],STR=['WeightTraining','Weight Training','Strength'];
const SPORT={Run:['Run','TrailRun','VirtualRun'],Bike:['Ride','VirtualRide','MountainBikeRide','GravelRide','EBikeRide','EMountainBikeRide','Handcycle','Velomobile'],Swim:['Swim','OpenWaterSwim']};
const sportOf=t=>Object.keys(SPORT).find(k=>SPORT[k].includes(t))||null;
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
const mondayOf=s=>addDays(s,-((new Date(s+'T12:00:00').getDay()+6)%7));
const fD=s=>s.slice(8,10)+'/'+s.slice(5,7),mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const num=(v,d=1)=>v==null?'–':v.toFixed(d),pct=v=>v==null?'–':`<span class="${v>0?'pos':v<0?'neg':''}">${v>0?'+':''}${v.toFixed(0)}%</span>`;

async function api(id,path,key,q){
 const u=new URL(`https://intervals.icu/api/v1/athlete/${id}/${path}`);Object.entries(q).forEach(([k,v])=>u.searchParams.set(k,v));
 const r=await fetch(u,{headers:{Authorization:'Basic '+btoa('API_KEY:'+key)}});
 if(!r.ok)throw new Error('HTTP '+r.status+(r.status==401||r.status==403?' (chiave o permessi non validi per questo atleta)':''));
 return r.json();
}
const ratioOf=x=>x.hrv!=null&&x.restingHR>0?x.hrv*x.restingHR/600:null; // HRV:HR come intervals.icu
function hrvSeries(w,oldest,newest,f=x=>x.hrv){
 const m={};w.forEach(x=>{const v=f(x);if(v!=null)m[x.id]=v});const rows=[];
 for(let d=oldest;d<=newest;d=addDays(d,1))rows.push({date:d,hrv:m[d]??null});
 const roll=(i,n,min)=>{const v=rows.slice(Math.max(0,i-n+1),i+1).map(r=>r.hrv).filter(x=>x!=null);return v.length>=min?mean(v):null};
 rows.forEach((r,i)=>{r.base=roll(i,P.short,Math.max(3,P.short>>1));r.long=roll(i,P.long,21);
  r.diff=r.base!=null&&r.long!=null?r.base-r.long:null;r.pct=r.diff!=null?r.diff/r.long*100:null});
 return rows;
}
function cv7(rows){const v=rows.slice(-7).map(r=>r.hrv).filter(x=>x!=null&&x>0).map(Math.log);if(v.length<4)return null;const m=mean(v);return Math.sqrt(v.reduce((s,x)=>s+(x-m)**2,0)/(v.length-1))/m*100}
function dailyVals(w,oldest,newest,f){const m={};w.forEach(x=>{const v=f(x);if(v!=null)m[x.id]=v});const o=[];for(let d=oldest;d<=newest;d=addDays(d,1))o.push(m[d]??null);return o}
function vs4w(v){const ok=a=>a.filter(x=>x!=null),all=ok(v),c=ok(v.slice(-7)),p=ok(v.slice(-35,-7)),cur=c.length>=3?mean(c):null,prev=p.length>=10?mean(p):null;
 return{last:all.length?all[all.length-1]:null,cur,prev,d:cur!=null&&prev!=null?cur-prev:null}}
function crossings(rows){let prev=0;const out=[];rows.forEach(r=>{if(r.diff==null||r.diff===0)return;const s=Math.sign(r.diff);if(prev&&s!==prev)out.push({date:r.date,dir:s>0?'up':'down',base:r.base});prev=s});return out}
function hrvStatus(rows){
 const d=rows.filter(r=>r.pct!=null);if(!d.length)return{state:'n/d'};
 const l=d[d.length-1],cr=crossings(rows),c=cr[cr.length-1],dv=rows.filter(r=>r.hrv!=null);
 return{state:l.pct<-P.tol?'down':l.pct>P.tol?'up':'stable',pct:l.pct,last:dv.length?dv[dv.length-1].hrv:null,
  cross:c?(c.dir==='up'?'↑ ':'↓ ')+fD(c.date):'–',crossDir:c?c.dir:null,crossDate:c?c.date:null,since:c?Math.round((new Date(rows[rows.length-1].date)-new Date(c.date))/864e5):null};
}
function weekly(acts){
 const g={},blank=w=>({week:w,ore:0,km:0,kg:0,carico:0,sedute:0});
 acts.forEach(a=>{const d=(a.start_date_local||'').slice(0,10);if(!d)return;const w=mondayOf(d),o=g[w]||(g[w]=blank(w));
  o.ore+=(a.moving_time||0)/3600;if(!STR.includes(a.type))o.km+=(a.distance||0)/1000;
  const k=KG.find(f=>a[f]!=null);if(k)o.kg+=a[k];o.carico+=a.icu_training_load||0;o.sedute++});
 const ws=Object.keys(g).sort();if(!ws.length)return[];
 const out=[];for(let w=ws[0];w<=ws[ws.length-1];w=addDays(w,7))out.push(g[w]||blank(w));return out;
}
function loadStatus(ws){
 const done=ws.filter(w=>w.week<mondayOf(iso(new Date())));if(done.length<2)return{state:'n/d'};
 const last=done[done.length-1],prev=done.length>P.weeks?done.slice(-1-P.weeks,-1):done.slice(0,-1);
 const r=k=>{const b=mean(prev.map(x=>x[k]));return b>0?(last[k]/b-1)*100:null},p=r('ore');
 return{state:p==null?'n/d':p>P.loadTol?'high':p<-P.loadTol?'low':'normal',week:last.week,pct:p,ore:last.ore,km:r('km'),kg:r('kg'),carico:r('carico')};
}
const ADV={'down|high':['🔴 Riduci','HRV in calo e carico elevato: valuta una settimana di scarico o meno intensità.'],
'down|normal':['🟠 Riduci/mantieni','HRV in calo con carico regolare: abbassa le intensità, tieni il volume.'],
'down|low':['🟠 Indaga','HRV in calo anche con poco carico: controlla sonno, stress, malattia, altri fattori.'],
'stable|high':['🟡 Mantieni','Carico alto ma HRV stabile: tollerato, non spingere oltre e monitora.'],
'stable|normal':['🟢 Mantieni/progredisci','Situazione equilibrata: progressione graduale possibile.'],
'stable|low':['🟢 Puoi aumentare','HRV stabile e carico basso: c\'è margine per aumentare.'],
'up|high':['🟢 Mantieni','HRV in crescita nonostante il carico alto: buon adattamento.'],
'up|normal':['🟢 Puoi aumentare','HRV in crescita con carico regolare: aumenta volume o intensità.'],
'up|low':['🟢 Aumenta','HRV alta e carico basso: ben recuperato, spazio per stimoli maggiori.']};
const advice=(h,l)=>ADV[h+'|'+l]||['⚪ Dati insufficienti','Servono più dati HRV e/o attività.'];
function sleepFlags(sl,sq){return{dur:!!(sl&&sl.d!=null&&sl.d<=-P.sleepH),qual:!!(sq&&sq.d!=null&&sq.prev>0&&sq.d/sq.prev*100<=-P.sleepQ)}}
function sleepIssues(sl,sq){const o=[],f=sleepFlags(sl,sq);
 if(f.dur)o.push(`sonno medio ${sl.cur.toFixed(1)} h, ${Math.abs(sl.d).toFixed(1)} h in meno rispetto alla media delle 4 settimane precedenti`);
 if(f.qual)o.push(`qualità del sonno ${(sq.d/sq.prev*100).toFixed(0)}% rispetto alla media delle 4 settimane precedenti`);
 return o}
function alerts(n,h,l,r){const o=[];
 if(r&&r.since!=null&&r.since<=3)o.push(`${n}: la baseline HRV:FC ha attraversato la long term ${r.crossDir==='up'?"verso l'alto":'verso il basso'} (${r.cross}).`);
 if(h.since!=null&&h.since<=3)o.push(`${n}: la baseline HRV ha attraversato la long term ${h.crossDir==='up'?"verso l'alto":'verso il basso'} (${h.cross}).`);
 if(l.state==='high'||l.state==='low')o.push(`${n}: ore settimanali ${l.pct>0?'+':''}${l.pct.toFixed(0)}% rispetto alla media delle ultime ${P.weeks} settimane.`);return o}

function hrvChart(rows){
 const W=900,H=300,m={l:42,r:10,t:10,b:24},vals=rows.flatMap(r=>[r.hrv,r.base,r.long]).filter(v=>v!=null);
 if(!vals.length)return'<p class="mu">Nessun dato HRV nel periodo.</p>';
 const pad=(Math.max(...vals)-Math.min(...vals))*.08||1,lo=Math.min(...vals)-pad,hi=Math.max(...vals)+pad,n=rows.length,x=i=>m.l+i*(W-m.l-m.r)/(n-1),y=v=>m.t+(hi-v)*(H-m.t-m.b)/(hi-lo);
 const line=(k,c)=>{let d='',pen=false;rows.forEach((r,i)=>{if(r[k]==null){pen=false;return}d+=(pen?'L':'M')+x(i).toFixed(1)+' '+y(r[k]).toFixed(1);pen=true});return`<path d="${d}" fill="none" stroke="${c}" stroke-width="2"/>`};
 let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafico HRV">`;
 for(let k=0;k<=4;k++){const v=lo+(hi-lo)*k/4;s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--ln)"/><text x="${m.l-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--mu)">${v.toFixed(hi-lo<6?2:0)}</text>`}
 for(let i=0;i<n;i+=30)s+=`<text x="${x(i)}" y="${H-6}" font-size="11" fill="var(--mu)">${fD(rows[i].date)}</text>`;
 rows.forEach((r,i)=>{if(r.hrv!=null)s+=`<circle cx="${x(i)}" cy="${y(r.hrv)}" r="2.5" fill="var(--mu)" opacity=".55"/>`});
 s+=line('base','var(--ac)')+line('long','var(--org)');
 crossings(rows).forEach(c=>{const i=rows.findIndex(r=>r.date===c.date),u=c.dir==='up',col=u?'var(--grn)':'var(--red)',cx=x(i),cy=y(c.base);
  s+=`<path d="M${cx} ${u?cy-9:cy+9} l-6 ${u?12:-12} h12z" fill="${col}"><title>Incrocio ${u?'verso l\'alto':'verso il basso'} ${fD(c.date)}</title></path>`});
 return s+'</svg><div class="leg"><span><i style="background:var(--mu)"></i>HRV daily</span><span><i style="background:var(--ac)"></i>Baseline ('+P.short+' gg)</span><span><i style="background:var(--org)"></i>Long term ('+P.long+' gg)</span><span class="pos">▲ incrocio verso l\'alto</span> <span class="neg">▼ verso il basso</span></div>';
}
function barChart(ws,k){
 const W=900,H=200,m={l:42,r:10,t:10,b:24},mx=Math.max(...ws.map(w=>w[k]),1)*1.1,bw=(W-m.l-m.r)/ws.length;
 let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Carico settimanale">`;
 ws.forEach((w,i)=>{const h=w[k]/mx*(H-m.t-m.b);s+=`<rect x="${m.l+i*bw+2}" y="${H-m.b-h}" width="${Math.max(bw-4,1)}" height="${h}" fill="var(--ac)"><title>${fD(w.week)}: ${w[k].toFixed(1)}</title></rect>`;
  const pv=ws.slice(Math.max(0,i-P.weeks),i).map(z=>z[k]);if(i%Math.ceil(ws.length/10)===0)s+=`<text x="${m.l+i*bw}" y="${H-6}" font-size="11" fill="var(--mu)">${fD(w.week)}</text>`});
 s+=`<text x="${m.l-6}" y="${m.t+8}" text-anchor="end" font-size="11" fill="var(--mu)">${mx.toFixed(0)}</text><text x="${m.l-6}" y="${H-m.b}" text-anchor="end" font-size="11" fill="var(--mu)">0</text>`;
 return s+'</svg>';
}

const MOTTO='Migliori di ieri, peggiori di domani';
const QUOTES=[
['Non è perché le cose sono difficili che non osiamo; è perché non osiamo che sono difficili.','Seneca'],
['Non è facile la via che dalla terra conduce alle stelle.','Seneca'],
['La fortuna aiuta gli audaci.','Virgilio'],
['Il lavoro ostinato vinse ogni cosa.','Virgilio'],
['La prima e più grande vittoria è vincere se stessi.','Platone'],
['Il principio è la parte più importante di ogni opera.','Platone'],
['Una vita senza ricerca non è degna di essere vissuta.','Socrate'],
['Chi vuole muovere il mondo prima muova se stesso.','Socrate'],
['La goccia scava la pietra.','Ovidio'],
['Ciò che sta sulla via diventa la via.','Marco Aurelio'],
['Non sono le cose a turbare gli uomini, ma le opinioni che essi hanno delle cose.','Epitteto'],

async function loadArticles(){try{const j=await(await fetch('articoli.json',{cache:'no-store'})).json();if(Array.isArray(j)&&j.length){S.arts=j;if(S.tab==='art')render()}}catch(e){}}
const chatGet=()=>{try{return JSON.parse(AP.get('chat','[]'))}catch(e){return[]}};
function vChat(){let h=`<div class="card" style="padding:12px"><div class="chips" style="margin:0"><button class="chip ${S.chat==='coach'?'on':''}" data-chat="coach">Il tuo coach</button><button class="chip ${S.chat==='ai'?'on':''}" data-chat="ai">Assistente AI</button></div></div>`;
 if(S.chat==='coach'){const m=chatGet();h+=`<div class="banner">Prova: in questa versione i messaggi restano solo su questo dispositivo. Nella versione finale arriveranno al coach.</div><div class="card"><div class="chat" id="chatbox">${m.length?m.map(x=>`<div class="b ${x.me?'me':'co'}">${esc(x.t)}</div>`).join(''):'<div class="mu sm">Scrivi qui un messaggio privato al tuo coach.</div>'}</div><form class="inp" id="chatf"><input id="chati" placeholder="Scrivi un messaggio…" autocomplete="off"><button class="btn" type="submit">Invia</button></form></div>`}
 else{const m=S.ai||[];h+=`<div class="banner">Prova: l'assistente non è ancora collegato. Nella versione finale risponderà a domande su sport, alimentazione e allenamento (senza sostituire il parere del medico).</div><div class="card"><div class="chips">${['Cosa mangiare prima di un allenamento lungo?','Come recupero meglio dopo una gara?','Quanto devo bere in allenamento?'].map(q=>`<button class="chip" data-aiq="${esc(q)}">${esc(q)}</button>`).join('')}</div><div class="chat" id="chatbox">${m.map(x=>`<div class="b ${x.me?'me':'co'}">${esc(x.t)}</div>`).join('')}</div><form class="inp" id="aif"><input id="aii" placeholder="Fai una domanda…" autocomplete="off"><button class="btn" type="submit">Invia</button></form></div>`}
 return h}
// ------------------------------ dettaglio allenamento
const VIS=[['dur','Durata'],['dist','Distanza'],['elev','Dislivello'],['pace','Ritmo / velocità'],['hr','Frequenza cardiaca'],['pow','Potenza'],['kcal','Calorie'],['load','Carico e intensità'],['rpe','RPE e sensazioni'],['zones','Tempo nelle zone di frequenza cardiaca'],['ints','Intervalli'],['desc','Note e descrizione'],['link','Pulsante «Apri su intervals.icu»']];
const visGet=()=>{try{const v=JSON.parse(AP.get('vis','null'));if(Array.isArray(v))return new Set(v)}catch(e){}return new Set(VIS.map(x=>x[0]).filter(k=>k!=='link'))};
const fsec=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`:`${m}:${String(r).padStart(2,'0')}`};
const isRunT=t=>['Run','TrailRun','VirtualRun','Walk','Hike'].includes(t),isSwimT=t=>['Swim','OpenWaterSwim'].includes(t);
function paceOf(v,t){if(!(v>0))return'';if(isRunT(t)){const s=Math.round(1000/v);return`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')} /km`}if(isSwimT(t)){const s=Math.round(100/v);return`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')} /100 m`}return itn(v*3.6,1)+' km/h'}
const ZCOL=['#9bb7d4','#6fb98f','#e2c044','#e08a3c','#d64545','#a02c5d','#6b2c6b'];
function actDetail(a,det){const V=visGet(),rows=[],kv=(l,v)=>{if(v!==''&&v!=null)rows.push(`<div class="kv"><span>${l}</span><b>${v}</b></div>`)};
 if(V.has('dur')){kv('Durata',a.moving_time?fdur(a.moving_time).replace(' h ',' h ')+(a.elapsed_time&&a.elapsed_time>a.moving_time*1.1?` <span class="xs mu">(tempo totale ${fdur(a.elapsed_time)})</span>`:''):'')}
 if(V.has('dist')&&a.distance)kv('Distanza',isSwimT(a.type)?itn(a.distance,0)+' m':itn(a.distance/1000,2)+' km');
 if(V.has('elev')&&a.total_elevation_gain)kv('Dislivello positivo',itn(a.total_elevation_gain,0)+' m');
 if(V.has('pace'))kv('Ritmo / velocità medi',paceOf(a.average_speed,a.type));
 if(V.has('hr')&&a.average_heartrate)kv('Frequenza cardiaca',`${Math.round(a.average_heartrate)} bpm medi`+(a.max_heartrate?` · max ${Math.round(a.max_heartrate)}`:''));
 if(V.has('pow')&&(a.icu_average_watts||a.average_watts))kv('Potenza',`${Math.round(a.icu_average_watts||a.average_watts)} W medi`+(a.icu_weighted_avg_watts?` · normalizzata ${Math.round(a.icu_weighted_avg_watts)} W`:''));
 if(V.has('kcal')&&a.calories)kv('Calorie',itn(a.calories,0)+' kcal');
 if(V.has('load')&&a.icu_training_load)kv('Carico',Math.round(a.icu_training_load)+(a.icu_intensity?` · intensità ${itn(a.icu_intensity,0)}%`:''));
 if(V.has('rpe')){if(a.icu_rpe)kv('RPE',a.icu_rpe+' / 10');if(a.feel)kv('Sensazioni',a.feel+' / 5')}
 let h=`<div style="display:flex;gap:12px;align-items:center;margin-bottom:6px"><div style="font-size:34px">${tyIcon(a.type)}</div><div><div style="font-size:19px;font-weight:700">${esc(a.name||a.type||'Attività')}</div><div class="xs mu">${new Date((a.start_date_local||'').slice(0,10)+'T12:00:00').toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'})}${(a.start_date_local||'').length>=16?' · ore '+a.start_date_local.slice(11,16):''}</div></div></div>`;
 h+=rows.length?rows.join(''):'<div class="mu sm" style="padding:8px 0">Nessun dato da mostrare per questo allenamento.</div>';
 const zt=a.icu_hr_zone_times;if(V.has('zones')&&Array.isArray(zt)&&zt.some(x=>x>0)){const tot=zt.reduce((x,y)=>x+(y||0),0)||1;h+='<div class="ct" style="margin:14px 0 4px">Tempo nelle zone di frequenza cardiaca</div>'+zt.map((x,i)=>x>0?`<div class="zr"><span class="zl">Z${i+1}</span><span class="zb"><i style="width:${Math.max(2,Math.round(x/tot*100))}%;background:${ZCOL[i%7]}"></i></span><span class="zt">${fdur(x)} · ${Math.round(x/tot*100)}%</span></div>`:'').join('')}
 const iv=(det&&det.icu_intervals)||a.icu_intervals;if(V.has('ints')){if(Array.isArray(iv)&&iv.length)h+='<div class="ct" style="margin:14px 0 4px">Intervalli</div><table><tr><th>#</th><th>Tipo</th><th>Durata</th><th>Distanza</th><th>FC</th><th>Ritmo</th></tr>'+iv.slice(0,40).map((x,i)=>`<tr><td>${i+1}</td><td style="text-align:left">${esc(x.label||(x.type==='RECOVERY'?'Recupero':'Lavoro'))}</td><td>${x.moving_time?fsec(x.moving_time):'–'}</td><td>${x.distance?itn(x.distance/1000,2)+' km':'–'}</td><td>${x.average_heartrate?Math.round(x.average_heartrate):'–'}</td><td>${paceOf(x.average_speed,a.type)||(x.average_watts?Math.round(x.average_watts)+' W':'–')}</td></tr>`).join('')+'</table>';else if(det===undefined)h+='<div class="xs mu" style="margin-top:12px">Carico gli intervalli…</div>'}
 const ds=(det&&det.description)||a.description;if(V.has('desc')&&ds)h+=`<div class="ct" style="margin:14px 0 4px">Note</div><div class="sm" style="white-space:pre-wrap">${esc(String(ds).slice(0,1200))}</div>`;
 if(V.has('link')&&a.id)h+=`<p style="margin-top:14px"><a class="lnk" href="https://intervals.icu/activities/${encodeURIComponent(a.id)}" target="_blank" rel="noopener">Apri su intervals.icu ↗</a></p>`;
 return h}
async function openAct(id){const a=S.r&&S.r.ac.find(x=>String(x.id)===String(id));if(!a)return;
 const show=det=>{$('sin').innerHTML=`<p style="margin:0 0 10px"><button class="btn sec" id="s-close">‹ Chiudi</button></p>`+actDetail(a,det);$('s-close').onclick=()=>$('sheet').classList.remove('on')};
 show(undefined);$('sheet').classList.add('on');
 if(!visGet().has('ints'))return;
 try{const r=await fetch(`https://intervals.icu/api/v1/activity/${encodeURIComponent(id)}?intervals=true`,{headers:{'Authorization':'Basic '+btoa('API_KEY:'+AP.get('key').trim())}});if(r.ok)show(await r.json());else show(null)}catch(e){show(null)}}
// ------------------------------ rendering
function render(){const v=$('view'),today=new Date();$('dt').textContent=today.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});
 $('hi').textContent='Ciao'+(AP.get('name')?' '+AP.get('name').split(' ')[0]:'')+' 👋';
 $('tabs').innerHTML=TABS.map(([k,i,l])=>`<button data-tab="${k}" class="${S.tab===k?'on':''}"><span>${i}</span>${l}</button>`).join('');
 let bn='';
 if(S.suspended){v.innerHTML='<div class="card center"><div class="big">⏸️</div><h2>Servizio sospeso</h2><p class="mu">Il tuo accesso è al momento sospeso. Per riattivarlo contatta il tuo coach.</p></div>';$('banner').innerHTML='';return}
 if(S.state==='setup'){v.innerHTML='<div class="card center"><div class="big">⚙️</div><h2>Configura la tua area</h2><p class="mu">Inserisci ID e chiave di intervals.icu (solo per la prova) nelle impostazioni.</p><button class="btn" id="open-set">Apri impostazioni</button></div>';$('banner').innerHTML='';return}
 if(S.state==='loading'){v.innerHTML='<div class="card center"><div class="big">⏳</div><p class="mu">Carico i tuoi dati…</p></div>';return}
 if(S.state==='err'){v.innerHTML=`<div class="card center"><div class="big">⚠️</div><p>${esc(S.err)}</p><button class="btn" id="retry">Riprova</button></div>`;return}
 if(AP.get('simsus')==='1')bn='<div class="banner">Prova: stai simulando un servizio sospeso.</div>';
 $('banner').innerHTML=bn+`<div class="xs mu" style="margin:0 20px">${S.at?'Aggiornato alle '+S.at:''}</div>`;
 v.innerHTML={oggi:vOggi,allen:vAllen,cal:vCal,report:vReport,art:vArt,chat:vChat}[S.tab]();
 if(S.tab==='report')fitReport();
 const cb=$('chatbox');if(cb)cb.scrollTop=cb.scrollHeight}
function fitReport(){document.querySelectorAll('.rpbox').forEach(b=>{const s=b.clientWidth/794;b.firstElementChild.style.transform=`scale(${s})`;b.style.height=(1120*s)+'px'})}
window.addEventListener('resize',()=>{if(S.tab==='report')fitReport()});
async function gate(){let sus=AP.get('simsus')==='1';const t=new URLSearchParams(location.search).get('t');
 if(t&&!sus){try{const j=await(await fetch('accessi.json',{cache:'no-store'})).json(),a=j.tokens&&j.tokens[t];if(a&&a.attivo===false)sus=true}catch(e){}}
 return sus}
async function load(){S.suspended=await gate();if(S.suspended){render();return}
 const key=AP.get('key').trim(),id=AP.get('id').trim();if(!key||!id){S.state='setup';render();return}
 S.state='loading';render();const newest=iso(new Date()),oldest=addDays(newest,-120);
 try{const [w,ac,ev]=await Promise.all([api(id,'wellness',key,{oldest,newest}),api(id,'activities',key,{oldest,newest}),api(id,'events',key,{oldest:newest,newest:addDays(newest,14)})]);
  S.r=buildAthlete(w,ac,AP.get('name')||'Atleta',oldest,newest);S.ev=(ev||[]).slice().sort((a,b)=>(a.start_date_local||'').localeCompare(b.start_date_local||''));S.msg=null;S.state='ok';S.at=new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}
 catch(e){S.state='err';S.err=e instanceof TypeError?'Connessione non riuscita: controlla la rete (o la restrizione del browser).':e.message}
 render();if(S.state==='ok'){S.wx=null;weather().then(w=>{S.wx=w;if(S.tab==='oggi')render()})}}
function openSheet(){RC.get('coach');$('sin').innerHTML=`<h2 style="margin-top:0">Impostazioni (prova)</h2>
 <label>Il tuo nome</label><input id="s-name" value="${esc(AP.get('name'))}">
 <label>ID atleta intervals.icu (es. i12345)</label><input id="s-id" value="${esc(AP.get('id'))}">
 <label>Chiave API intervals.icu <span class="xs">(solo per la prova: nella versione finale non è nella pagina)</span></label><input id="s-key" type="password" value="${esc(AP.get('key'))}" autocomplete="off">
 <label>Città (per il meteo)</label><input id="s-city" value="${esc(AP.get('city'))}">
 <label>Data di nascita (per l'oroscopo)</label><input id="s-birth" type="date" value="${esc(AP.get('birth'))}">
 <label>Nome del coach (nel report)</label><input id="s-coach" value="${esc(RC.get('coach'))}">
 <label>Colore del report</label><input id="s-col" type="color" value="${RC.get('color','#0f6e68')}" style="height:42px;padding:2px">
 <label class="row"><input id="s-sus" type="checkbox" ${AP.get('simsus')==='1'?'checked':''}> Simula «servizio sospeso» (solo prova)</label>
 <label class="row"><input id="s-push" type="checkbox" ${AP.get('push','1')==='1'?'checked':''}> Salva il voto «Come ti senti» anche su intervals.icu (campo Umore)</label>
 <details class="dd"><summary>Dati dell'allenamento da mostrare</summary>${VIS.map(([k,l])=>`<label class="row"><input type="checkbox" class="s-vis" data-k="${k}" ${visGet().has(k)?'checked':''}> ${l}</label>`).join('')}</details>
 <p style="display:flex;gap:8px;margin-top:20px"><button class="btn" id="s-save">Salva e aggiorna</button><button class="btn sec" id="s-close">Chiudi</button></p>`;
 $('sheet').classList.add('on');$('s-close').onclick=()=>$('sheet').classList.remove('on');
 $('s-save').onclick=()=>{AP.set('name',$('s-name').value);AP.set('id',$('s-id').value);AP.set('key',$('s-key').value);AP.set('city',$('s-city').value);AP.set('birth',$('s-birth').value);AP.set('simsus',$('s-sus').checked?'1':'0');AP.set('push',$('s-push').checked?'1':'0');AP.set('vis',JSON.stringify([...document.querySelectorAll('.s-vis')].filter(c=>c.checked).map(c=>c.dataset.k)));RC.set('coach',$('s-coach').value);RC.set('color',$('s-col').value);$('sheet').classList.remove('on');load()}}
document.addEventListener('click',async e=>{const ac=e.target.closest('[data-act]');if(ac&&!e.target.closest('button'))return openAct(ac.dataset.act);const ar=e.target.closest('[data-art]');if(ar&&!e.target.closest('button')){S.artOpen=ar.dataset.art;render();window.scrollTo(0,0);return}const t=e.target.closest('button');if(!t)return;if(t.id==='artback'){S.artOpen=null;render();return}
 if(t.id==='gear'||t.id==='open-set')return openSheet();if(t.id==='retry')return load();
 if(t.dataset.tab){S.tab=t.dataset.tab;render();window.scrollTo(0,0);return}
 if(t.dataset.mood!=null){const n=t.dataset.mood,mo=moodAll();mo[iso(new Date())]=n;AP.set('mood',JSON.stringify(mo));S.mm={st:'saving'};render();const r=await pushMood(+n);S.mm=r.skip?null:r.ok?{st:'ok',v:MOOD2ICU[n]}:{st:'err',m:r.err};render();return}
 if(t.dataset.sport){S.sport=t.dataset.sport;render();return}
 if(t.dataset.chat){S.chat=t.dataset.chat;render();return}
 if(t.dataset.aiq){S.ai=(S.ai||[]);S.ai.push({me:1,t:t.dataset.aiq},{t:'(Prova) Qui risponderà l\'assistente AI, quando sarà collegato.'});render();return}
 if(t.id==='dlpdf'){$('dlmsg').textContent='Creo il PDF…';try{const b=await makePdf(S.r),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=repName(S.r);a.click();$('dlmsg').textContent='PDF scaricato.'}catch(x){$('dlmsg').textContent='Errore: '+x.message}}});
document.addEventListener('submit',e=>{e.preventDefault();
 if(e.target.id==='chatf'){const i=$('chati'),t=i.value.trim();if(!t)return;const m=chatGet();m.push({me:1,t});AP.set('chat',JSON.stringify(m));render()}
 if(e.target.id==='qaf'){const i=$('qai'),x=i.value.trim();if(!x||!S.artOpen)return;const q=qaAll();(q[S.artOpen]=q[S.artOpen]||[]).push({t:x,d:iso(new Date())});AP.set('qa',JSON.stringify(q));render()}
 if(e.target.id==='aif'){const i=$('aii'),t=i.value.trim();if(!t)return;S.ai=(S.ai||[]);S.ai.push({me:1,t},{t:'(Prova) Qui risponderà l\'assistente AI, quando sarà collegato.'});render()}});
loadArticles();load();
</script></body></html>
